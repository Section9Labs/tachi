name: Swift service
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux-binary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build production Linux executable
        run: docker build -t tachi-service .
      - name: Exercise binary in clean Linux runtime
        shell: bash
        run: |
          set -eu
          container=$(docker run -d -p 127.0.0.1::8743 tachi-service)
          trap 'docker rm -f "$container" >/dev/null' EXIT
          port=$(docker port "$container" 8743/tcp | cut -d: -f2)
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail "http://127.0.0.1:$port/v1/status"
          python3 qa/probe_status.py --port "$port"
          docker cp "$container:/usr/local/bin/tachi-coordinator" tachi-coordinator
          TACHI_TEST_COORDINATOR="$PWD/tachi-coordinator" python3 -W error -m unittest discover -s tests -p 'test_runtime_team_http.py'
          docker cp "$container:/usr/local/bin/tachi-accounts" tachi-accounts
          if ! command -v sqlite3 >/dev/null; then sudo apt-get update && sudo apt-get install -y sqlite3; fi
          python3 -W error qa/linux_restore.py ./tachi-coordinator ./tachi-accounts
          python3 -W error ServiceTests/Acceptance/queue_diagnostics.py ./tachi-coordinator
          docker exec "$container" tachi-accounts invite-client --db /var/lib/tachi/smoke.sqlite --human-id smoke --scope sessions:read --out /var/lib/tachi/smoke.invitation
          docker exec "$container" sqlite3 -readonly /var/lib/tachi/smoke.sqlite 'PRAGMA integrity_check' | grep -Fx ok
          tar czf tachi-coordinator-linux-amd64.tar.gz tachi-coordinator tachi-accounts -C deploy/linux tachi-coordinator.service
      - name: Install the standalone archive and restart a paired workspace
        shell: bash
        run: |
          set -eu
          stage=$(mktemp -d)
          tar xzf tachi-coordinator-linux-amd64.tar.gz -C "$stage"
          sudo useradd --system --user-group --home-dir /var/lib/tachi --no-create-home --shell /usr/sbin/nologin tachi
          sudo install -m 0755 "$stage/tachi-coordinator" "$stage/tachi-accounts" /usr/local/bin/
          sudo install -m 0644 "$stage/tachi-coordinator.service" /etc/systemd/system/
          sudo systemd-analyze verify /etc/systemd/system/tachi-coordinator.service
          sudo systemctl daemon-reload
          sudo systemctl enable --now tachi-coordinator.service
          python3 -W error qa/linux_systemd.py
      - uses: actions/upload-artifact@v4
        with:
          name: tachi-coordinator-linux-amd64
          path: tachi-coordinator-linux-amd64.tar.gz
  packages:
    runs-on: ubuntu-24.04
    container: swift:6.3-noble
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install SQLite, curl, and OpenSSL development headers
        run: apt-get update && apt-get install -y --no-install-recommends libsqlite3-dev libcurl4-openssl-dev libssl-dev python3
      - name: Test runtime
        run: swift test --package-path Packages/TachiRuntime
      - name: Test external Swift adapter onboarding
        run: swift test --package-path Examples/AdapterOnboarding -Xswiftc -warnings-as-errors
      - name: Test accounts
        run: swift test --package-path Packages/TachiAccounts
      - name: Test host transport
        run: swift test --package-path Packages/TachiHostTransport -Xswiftc -warnings-as-errors
      - name: Test Grok connector
        run: swift test --package-path Packages/TachiGrok
      - name: Test coordinator integration
        run: swift test
      - name: Verify paired HTTP and legacy SQLite migration
        shell: bash
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          legacy=$(mktemp -d)
          git archive 10ee249 | tar -x -C "$legacy"
          python3 qa/swift_service_parity.py pairing --legacy-root "$legacy"
          python3 qa/swift_service_parity.py reference-teams
          python3 -W error qa/enrollment_http.py --service-root . \
            --coordinator "$(swift build --show-bin-path)/tachi-coordinator" \
            --accounts "$(swift build --package-path Packages/TachiAccounts --show-bin-path)/tachi-accounts"
          python3 qa/swift_service_parity.py workspaces
          python3 qa/swift_service_parity.py artifacts
          python3 qa/swift_service_parity.py assignments
          python3 qa/swift_service_parity.py export
          TACHI_TEST_COORDINATOR="$(swift build --show-bin-path)/tachi-coordinator" python3 -W error -m unittest discover -s tests -p 'test_runtime_team_http.py'
