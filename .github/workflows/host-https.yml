name: Mac host HTTPS
on:
  pull_request:
    paths: &host_paths
      - 'Packages/TachiHostTransport/**'
      - 'Packages/TachiAccounts/**'
      - 'Packages/TachiRuntime/**'
      - 'tachi/hosts/**'
      - 'tachi/runtime/**'
      - '.github/workflows/host-https.yml'
  push:
    branches: [main]
    paths: *host_paths

permissions:
  contents: read

jobs:
  https:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test the Swift host transport
        run: swift test --package-path Packages/TachiHostTransport -Xswiftc -warnings-as-errors
      - name: Exercise two host agents over loopback TLS
        env:
          PYTHONPATH: .
        run: |
          bin=$(swift build --package-path Packages/TachiHostTransport --show-bin-path)
          python3 -W error Packages/TachiHostTransport/Tests/Acceptance/process_lab.py "$bin" --https
